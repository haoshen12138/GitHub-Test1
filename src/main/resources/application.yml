# src/main/resources/application.yml
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/secondhand_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # MyBatis Plus 配置
  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL 日志
      map-underscore-to-camel-case: true  # 下划线转驼峰
    global-config:
      db-config:
        logic-delete-field: deleted  # 逻辑删除字段名
        logic-not-delete-value: 0    # 逻辑未删除值
        logic-delete-value: 1        # 逻辑删除值

  # 自动初始化数据库
  sql:
    init:
      mode: always  # 总是初始化
      schema-locations: classpath:schema.sql  # 表结构文件
      data-locations: classpath:data.sql      # 初始数据文件

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /
